ock,0),fmt(x.out,0)])))}</div>${card('ABCD portfolio evolution · SKUs by class',lineGraph(['A','B','C','D'].map(c=>({name:'Class '+c,color:colors[c],values:stats.map(x=>x.counts[c])})),stats.map(x=>x.month),{dec:0}))}${categoryAnalysis(H)}${card('ABCD heatmap by SKU',`<p>Up to 60 SKUs are shown at once. Search the catalogue to inspect a particular product.</p><input class="bigselect" id="historySearch" placeholder="Search SKU or product name…" value="${esc(search)}"/>${table(['SKU / Product',...stats.map(x=>x.month)],subset.map(r=>tr([`<button class="linksku" data-focus="${esc(r.sku)}">${esc(r.sku)}</button><br><span class="small">${esc(r.name)}</span>`,...r.timeline.map(x=>`<span class="pill ${x.cls}">${x.cls}</span>`)])))}<p class="small">${filtered.length} matching SKUs; the first 60 are displayed.</p>`)}`}

function legacyScorecard(){const H=getHistory();if(!H.length)return card('KPI Cockpit','<p>Load a product catalogue to activate the scorecard.</p>');const stats=monthlyStats(H),last=stats.at(-1),counts=last.counts,valid=H.filter(r=>Number.isFinite(r.score)),cover=H.filter(r=>Number.isFinite(r.coverage)),s=H.length,receipts=H.reduce((a,r)=>a+r.ins.reduce((x,y)=>x+y,0),0),issues=H.reduce((a,r)=>a+r.outs.reduce((x,y)=>x+y,0),0),changes=H.reduce((a,r)=>a+r.timeline.slice(1).filter((v,i)=>v.cls!==r.timeline[i].cls).length,0),short=H.filter(r=>r.ratio!==null&&r.ratio<.8).length,over=H.filter(r=>r.ratio!==null&&r.ratio>1.2).length,negative=H.filter(r=>r.negative).length;return `<div class="hint"><b>Integrated Performance Dashboard:</b> a consolidated management view of inventory, demand, portfolio composition, risk and operational priorities. Revenue, EBITDA, ROI and monetary inventory value cannot be calculated without prices and costs.</div><h2>CEO · COO · CPO Performance Scorecard</h2><div class="exportbox"><b>Export calculated evidence for Excel and Power BI</b><p>The detailed file contains one record per SKU and rolling period, including calculated indicators and class movements. The monthly summary provides portfolio-level KPI values. Both exports reflect the current model inputs.</p><div class="actions"><button class="btn primary" id="exportFull">↓ Download complete SKU-period calculations · CSV</button><button class="btn" id="exportKpis">↓ Download monthly KPI summary · CSV</button></div></div><h3>Operations and Inventory · COO / CPO</h3><div class="grid">${kpi('SKUs',s)}${kpi('Closing inventory (u)',fmt(last.stock,0))}${kpi('Receipts · latest 3 months',fmt(receipts,0))}${kpi('Issues · latest 3 months',fmt(issues,0))}${kpi('Average cover (months)',fmt(cover.length?cover.reduce((a,r)=>a+r.coverage,0)/cover.length:null))}${kpi('Below target coverage',short)}${kpi('Above target coverage',over)}${kpi('Historical negative stock',negative)}</div><h3>Portfolio Quality and Classification · CEO / CPO</h3><div class="grid">${['A','B','C','D'].map(c=>kpi('Class '+c,counts[c])).join('')}${kpi('Share of A + B',fmt(100*(counts.A+counts.B)/s,1)+'%')}${kpi('Average score',fmt(valid.length?valid.reduce((a,r)=>a+r.score,0)/valid.length:null))}${kpi('Average margin',fmt(100*H.reduce((a,r)=>a+r.margin,0)/s,1)+'%')}${kpi('Class changes',changes)}</div><div class="cols2">${card('Total inventory trend',lineGraph([{name:'Closing inventory',color:'#48d8aa',values:stats.map(x=>x.stock)}],stats.map(x=>x.month),{dec:0}))}${card('Monthly receipts and issues',lineGraph([{name:'Receipts',color:'#63b9e9',values:stats.map(x=>x.in)},{name:'Issues',color:'#f3be68',values:stats.map(x=>x.out)}],stats.map(x=>x.month),{dec:0}))}</div>${categoryAnalysis(H)}${card('KPI Dictionary · Ownership and interpretation',table(['Perspective','KPI','Calculation','Owner','Management use'],[['Operations','Closing stock','Opening + receipts − issues','COO','Inventory continuity'],['Operations','Monthly turnover','Issues / average stock','COO','Product movement efficiency'],['Procurement','Coverage (months)','Closing stock / average monthly demand','CPO','Available supply horizon'],['Procurement','Coverage / target','Coverage / target months','CPO','Potential stockout or excess'],['Operations','Receipts and issues','Transactions within the period','COO','Operational throughput'],['Portfolio','ABCD class mix','Number of SKUs in each class','CEO','Portfolio composition'],['Portfolio','ABCD score','Weighted margin, turnover and cover marks','CEO / CPO','Relative product prioritisation'],['Portfolio','Class transitions','Comparison of consecutive periods','CEO / COO','Product trajectory monitoring'],['Finance','Revenue / ROI / working capital','Requires financial input fields','CEO / CFO','Not available from this dataset']].map(tr)))}`}

function legacyNarrative(){let H=getHistory();if(!H.length)return card('Management narrative','<p>Load data to activate the diagnosis.</p>');let stats=monthlyStats(H),prev=stats.length>1?stats.at(-2):null,cur=stats.at(-1),initial=stats[0],shifts=[];for(const r of H){let t=r.timeline;for(let i=1;i<t.length;i++)if(t[i].cls!==t[i-1].cls)shifts.push({sku:r.sku,name:r.name,from:t[i-1].cls,to:t[i].cls,month:t[i].month})}let declines=shifts.filter(s=>'ABCD'.indexOf(s.to)>'ABCD'.indexOf(s.from));let improves=shifts.filter(s=>'ABCD'.indexOf(s.to)<'ABCD'.indexOf(s.from));let over=H.filter(r=>r.ratio!==null&&r.ratio>1.2),under=H.filter(r=>r.ratio!==null&&r.ratio<.8),neg=H.filter(r=>r.negative),missing=H.filter(r=>r.cls==='—');let delta=cur.stock-initial.stock;return `<div class="hint"><b>Diagnóstico narrativo automático using explicit rules:</b> se genera localmente a partir del archivo cargado, sin servicio de IA externo y sin inventar datos financieros. Es un apoyo docente, no una decisión empresarial ejecutada.</div>${card('Executive summary · '+esc(cur.month),`<p>En el último periodo analizado hay <b>${H.length} referencias</b>. ABCD distribution: <b>${cur.counts.A} A, ${cur.counts.B} B, ${cur.counts.C} C y ${cur.counts.D} D</b>. El inventario total es de <b>${fmt(cur.stock,0)} unidades</b>, con una variación de <b>${fmt(delta,0)} unidades</b> respecto a la primera ventana comparable (${esc(initial.month)}).</p><p>Se observan <b>${shifts.length} transiciones de clasificación</b> en la serie (${declines.length} empeoramientos y ${improves.length} mejoras). Estos cambios son resultados del scoring, no prueban por sí mismos causas comerciales.</p><p>The latest window presenta <b>${over.length} referencias</b> con ratio de cobertura superior a 1,2 y <b>${under.length}</b> inferiores a 0,8. Detected <b>${neg.length}</b> referencias con stock negativo en alguna fecha y <b>${missing.length}</b> sin score computable.</p>`)}<div class="cols2">${card('Deterioration alerts',declines.length?table(['SKU','Transition','Ventana'],declines.slice(-15).map(x=>tr([esc(x.sku),`<span class="pill ${x.from}">${x.from}</span> → <span class="pill ${x.to}">${x.to}</span>`,esc(x.month)]))):'<p>No class deterioration was detected between windows.</p>')}${card('Improvements detected',improves.length?table(['SKU','Transition','Ventana'],improves.slice(-15).map(x=>tr([esc(x.sku),`<span class="pill ${x.from}">${x.from}</span> → <span class="pill ${x.to}">${x.to}</span>`,esc(x.month)]))):'<p>No class improvements were detected between windows.</p>')}</div>${card('Management interpretation by role',`<div class="steps"><div class="step"><b>CEO · ESTRATEGIA</b><h3>Balance del portfolio</h3><p>Revisar el peso de A y B (${fmt(100*(cur.counts.A+cur.counts.B)/H.length,1)}%) frente a C y D, y la sensibilidad de las clases a pesos y rangos.</p></div><div class="step"><b>COO · OPERACIONES</b><h3>Flujos y continuidad</h3><p>Check los ${neg.length} casos con existencias negativas en algún mes y validar inventarios físicos y movimientos.</p></div><div class="step"><b>CPO · COMPRAS</b><h3>Aprovisionamiento</h3><p>Priorizar análisis de ${under.length} SKUs below target coverage y ${over.length} con sobrecobertura; contrastar pedidos y plazos.</p></div></div>`)}${card('Classroom discussion questions',`<div class="callout">¿Qué productos cambiaron de A a B o C? Comprueba las ventanas y separa variaciones en ventas, stock y margen.</div><div class="callout">¿Cómo cambia el mix ABCD si modificas el peso del margen manteniendo la suma de pesos en 1?</div><div class="callout">¿Cuáles de estos KPI son operativos y cuáles requieren nuevas variables financieras para ser cuantificables?</div>`)}`}

function card(title,content,desc=''){return `<section class="card"><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}${content}</section>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function tr(cells){return '<tr>'+cells.map(v=>'<td>'+v+'</td>').join('')+'</tr>'}function inp(path,value,type='number',step='any'){return `<input aria-label="${esc(path)}" data-path="${esc(path)}" type="${type}" ${type==='number'?`step="${step}"`:''} value="${esc(value)}">`}function kpi(label,val){return `<div class="card kpi"><small>${label}</small><strong>${val}</strong></div>`}function svgBars(items, opts={}){const W=620,H=285,left=51,top=19,base=242,max=Math.max(...items.map(x=>Math.max(0,no(x.v))),1)*1.16,bw=(W-left-15)/Math.max(1,items.length);let svg=`<svg class="svg" role="img" aria-label="${esc(opts.label||'Bar chart')}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;for(let k=0;k<=4;k++){let y=base-k*(base-top)/4;svg+=`<line x1="${left}" x2="${W-9}" y1="${y}" y2="${y}" stroke="#30445d"/><text x="${left-7}" y="${y+4}" text-anchor="end" fill="#9ab2c8" font-size="11">${fmt(max*k/4,opts.dec??1)}</text>`}items.forEach((x,i)=>{const x0=left+i*bw+bw*.17,w=bw*.66,h=Math.max(0,no(x.v))/max*(base-top),y=base-h;svg+=`<rect x="${x0}" y="${y}" width="${w}" height="${h}" rx="4" fill="${x.color||'#30b8d0'}"><title>${esc(x.label)}: ${fmt(no(x.v))}</title></rect><text x="${x0+w/2}" y="${base+17}" fill="#b4c6da" text-anchor="middle" font-size="${items.length>12?9:11}">${esc(String(x.label).slice(0,items.length>12?6:11))}</text>`});return svg+'</svg>'}function pie(items){let tot=items.reduce((a,x)=>a+x.v,0),r=85,cx=145,cy=137,a=-Math.PI/2;if(!tot)return '<div class="empty">No data suficientes.</div>';let svg=`<svg class="svg" viewBox="0 0 460 275" aria-label="ABCD distribution" role="img">`;for(const item of items){if(!item.v)continue;let da=item.v/tot*Math.PI*2,aa=a+da,large=da>Math.PI?1:0,x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(aa),y2=cy+r*Math.sin(aa);if(da>Math.PI*2-.00001)svg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${item.color}"/>`;else svg+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${item.color}"/>`;a=aa}svg+=`<circle cx="${cx}" cy="${cy}" r="49" fill="#111e32"/><text x="${cx}" y="${cy+7}" fill="#fff" text-anchor="middle" font-size="25" font-weight="bold">${tot}</text>`;items.forEach((x,i)=>svg+=`<rect x="285" y="${60+i*39}" width="15" height="15" rx="3" fill="${x.color}"/><text x="309" y="${73+i*39}" fill="#d4e7f3" font-size="15">${x.label}: ${x.v}</text>`);return svg+'</svg>'}const colors={A:'#48d8aa',B:'#55bce6',C:'#f3be68',D:'#ef7e92'};
function overview(R){if(!R.length)return '<div class="card"><h2>New model ready</h2><p>Download the CSV template, fill in SKUs and monthly transactions using Excel, then select Import my CSV. You can also edit products and transactions in the app.</p></div>';const counts=Object.fromEntries(['A','B','C','D'].map(k=>[k,R.filter(r=>r.cls===k).length]));let stock=R.reduce((x,r)=>x+r.closes[2],0),neg=R.filter(r=>r.negative);const shown=pageSlice(R,'inicio',true);return `<div class="grid">${kpi('Products analysed',R.length)}${kpi('Closing stock · units',fmt(stock,0))}${kpi('Class A + B products',counts.A+counts.B)}${kpi('Negative stock alerts',neg.length)}</div><div class="cols2">${card('Classification ABCD',pie(['A','B','C','D'].map(k=>({label:k,v:counts[k],color:colors[k]}))),'Distribution across the loaded catalogue.')}${card('Scoring · first 16 SKUs',svgBars(R.slice(0,16).map(r=>({label:r.sku,v:r.score||0,color:colors[r.cls]||'#74869a'})),{label:'Puntuación ABCD'}),'First 16 SKUs are plotted; all SKUs are included in calculations.')}</div>${card('Operational actions · product catalogue',pager('inicio',R.length)+table(['SKU','Product','Score','Class','Coverage / target','Recommended action'],shown.map(r=>tr([esc(r.sku),esc(r.name),fmt(r.score),`<span class="pill ${r.cls}">${r.cls}</span>`,fmt(r.ratio),esc(r.action)]))))}${neg.length?`<div class="hint warn"><b>Alert:</b> ${neg.length} products have recorded negative inventory. Review Calculate.</div>`:''}${Math.abs(valid()-1)>0.00001?`<div class="hint warn"><b>Weights:</b> sum to ${fmt(valid(),3)}.</div>`:''}`}
function imput(){return `<div id="livecalcstatus" class="hint">Live calculator: changing weights and thresholds updates every result. Ensure transaction months match the period configuration.</div>`+card('Inputs · Model Configuration',`<div class="formgrid">${state.months.map((v,i)=>`<label class="field">Month ${i+1}${inp(`months.${i}`,v,'month')}</label>`).join('')}</div><div class="hint">The configured months determine which transactions are included. If you change a month, update its associated transactions.</div><h3>Scoring weights (must total 1.00)</h3><div class="formgrid">${['Margin','Turnover','Cobertura vs. tolerancia'].map((s,i)=>`<label class="field">${s}${inp(`weights.${i}`,state.weights[i])}</label>`).join('')}</div><p><b>Total weight: ${fmt(valid(),3)}</b> ${Math.abs(valid()-1)<.00001?'✓ Valid':'⚠ Review'}</p><h3>ABCD thresholds · overall score</h3><div class="formgrid">${['A: score ≥','B: score ≥','C: score ≥'].map((s,i)=>`<label class="field">${s}${inp(`thresholds.${i}`,state.thresholds[i])}</label>`).join('')}</div><div class="callout"><b>Learning tip:</b> increase the margin weighting and observe changes in classification. Restore the baseline with Load sample.</div>`,'Equivalent to the workbook Inputs sheet: periods, weights and class thresholds. Editing weights or thresholds recalculates the model.')+inputLivePreview()}function inputLivePreview(){let R=getResults(),counts=Object.fromEntries(['A','B','C','D'].map(c=>[c,R.filter(r=>r.cls===c).length]));return `<div class="card"><h2>Live preview · impact of your inputs</h2><p>Estas cifras se vuelven a calcular al modificar un peso, umbral o rango. Review Calculate y CMI para el detalle completo.</p><div class="grid">${['A','B','C','D'].map(c=>kpi('Productos '+c,counts[c])).join('')}</div>${table(['SKU','Product','Current score','Current class'],R.slice(0,8).map(r=>tr([esc(r.sku),esc(r.name),fmt(r.score),`<span class="pill ${r.cls}">${r.cls}</span>`])))}</div>`}function range(){let sections=[['margin','Margin (%)','Enter margins as decimals: 0.30 = 30%.'],['turnover','Turnover (times/month)','Monthly issues divided by monthly average inventory.'],['coverage','Coverage / tolerance','A higher ratio indicates relatively greater inventory coverage; the scoring table assigns a lower mark.']];return sections.map(([key,t,desc])=>card(t,table(['Minimum (inclusive)','Score', ''],state.ranges[key].map((pair,i)=>tr([inp(`ranges.${key}.${i}.0`,pair[0]),inp(`ranges.${key}.${i}.1`,pair[1]),i===0?'Initial band':'From this minimum']))),desc)).join('')+`<div class="hint">The scoring range follows approximate-match VLOOKUP logic: use the score associated with the highest lower bound not exceeding the observed value. Keep lower bounds in ascending order.</div>`}function productos(){const indices=visibleIndices(state.products,'productos',p=>p.sku+' '+p.name);let rows=indices.map(i=>{let p=state.products[i];return tr([inp(`products.${i}.sku`,p.sku,'text'),inp(`products.${i}.name`,p.name,'text'),inp(`products.${i}.stock`,p.stock),inp(`products.${i}.margin`,p.margin),inp(`products.${i}.tolerance`,p.tolerance),`<button class="btn warning" data-delete="product:${i}">Delete</button>`])});return card('Products · SKU Master',`<div class="actions"><button class="btn primary" data-add="product">+ Add product</button></div>${pager('productos',state.products.length,true)}${table(['SKU','Product','Opening stock (u)','Margin (0–1)','Coverage target (months)',''],rows)}<div class="hint">Enter margin as a decimal: 0.32 means 32%. The CSV column margen_pct takes the value 32. Every SKU must be unique.</div>`,'Initial inventory and parameters for each product.')}function motion(){const indices=visibleIndices(state.motions,'motion',m=>m.sku+' '+m.month);let rows=indices.map(i=>{let m=state.motions[i];return tr([`<input aria-label="SKU" data-path="motions.${i}.sku" type="text" value="${esc(m.sku)}">`,inp(`motions.${i}.month`,m.month,'month'),inp(`motions.${i}.in`,m.in),inp(`motions.${i}.out`,m.out),`<button class="btn warning" data-delete="motion:${i}">Delete</button>`])});return card('Motion · Receipts and Issues',`<div class="actions"><button class="btn primary" data-add="motion">+ Add transaction</button></div>${pager('motion',state.motions.length,true)}${table(['SKU','Month','Receipts (u)','Issues (u)',''],rows)}<div class="hint">Multiple transactions may be entered for the same SKU and month; the model aggregates them.</div>`,'Transactions are linked by SKU and month.')}function calculate(R){let heads=['SKU','Product','Margin','Coverage target','Opening'];for(let j=1;j<=3;j++)heads.push('Receipts M'+j,'Issues M'+j,'Opening M'+j,'Closing M'+j,'Turnover M'+j);heads.push('Average demand','Coverage','Coverage / target','Margin score','Turnover score','Coverage score','Score','Class','Action');let rows=pageSlice(R,'calculate',true).map(r=>{let x=[esc(r.sku),esc(r.name),fmt(r.margin*100)+'%',fmt(r.tolerance),fmt(r.stock,0)];for(let j=0;j<3;j++)x.push(fmt(r.ins[j],0),fmt(r.outs[j],0),fmt(r.opens[j],0),r.closes[j]<0?`<span style="color:#ff93a5">${fmt(r.closes[j],0)}</span>`:fmt(r.closes[j],0),fmt(r.turns[j]));x.push(fmt(r.demand),fmt(r.coverage),fmt(r.ratio),r.marginScore,r.turnScore,r.covScore??'—',fmt(r.score),`<span class="pill ${r.cls}">${r.cls}</span>`,esc(ACTION_DEFINITIONS.find(a=>a.key===actionFor(r)).title));return tr(x)});return card('Calculate · Full Calculation',pager('calculate',R.length,true)+table(heads,rows),'Latest three-month rolling window. Open ABCD Evolution to review the complete time series.')+`<div class="cols2">${card('Average monthly turnover',svgBars(R.slice(0,16).map(r=>({label:r.sku,v:r.turns.reduce((a,b)=>a+b,0)/3})),{label:'Average turnover'}))}${card('Coverage / tolerance',svgBars(R.slice(0,16).map(r=>({label:r.sku,v:r.ratio||0,color:r.ratio>1.2?'#ef7e92':r.ratio<.8?'#f3be68':'#48d8aa'})),{label:'Coverage / target ratio'}))}</div><div class="hint"><b>Formulas:</b> closing = opening + receipts − issues; turnover = issues / average inventory; demand = average monthly issues over the last 3 months; coverage = MAX(0, latest closing / demand); coverage ratio = coverage / target; weighted score = sum of weighted criterion scores. If demand is missing, coverage and class remain unavailable rather than being forced to zero.</div>`}function reference(title,heads,rows,desc){return card(title,table(heads,rows.map(row=>tr(row.map(esc)))),desc)}function learn(){return card('Learning Guide · From Inputs to Executive Decisions',`<div class="steps"><div class="step"><b>STEP 01</b><h3>Configure the model</h3><p>Review the analysis periods, scoring weights and ABCD thresholds in Inputs. Weights must sum to one.</p></div><div class="step"><b>STEP 02</b><h3>Validate the score bands</h3><p>Use Range to review the four bands for each scoring criterion and the coverage penalty.</p></div><div class="step"><b>STEP 03</b><h3>Manage the catalogue</h3><p>Edit a product's initial stock, margin or target coverage in Products.</p></div><div class="step"><b>STEP 04</b><h3>Model inventory movements</h3><p>Record receipts and issues by SKU and period in Motion.</p></div><div class="step"><b>STEP 05</b><h3>Interpret calculations</h3><p>Review inventory, turnover, coverage, weighted scores and ABCD classes in Calculate.</p></div><div class="step"><b>STEP 06</b><h3>Trace change over time</h3><p>Follow individual products and category-level performance in ABCD Evolution.</p></div><div class="step"><b>STEP 07</b><h3>Make operational decisions</h3><p>Review Diagnosis and Action Priorities, then assess the consolidated KPI Cockpit.</p></div><div class="step"><b>STEP 08</b><h3>Transfer the evidence</h3><p>Download calculated SKU-period records, monthly KPIs and the action register for Excel or Power BI.</p></div></div><div class="callout"><b>Exercise A:</b> Increase the margin weighting while keeping the sum of weights equal to one. Which SKUs change class?</div><div class="callout"><b>Exercise B:</b> Raise the opening stock of one pr
